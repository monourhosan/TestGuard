[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testguard"
version = "1.0.0"
description = "Automated API Quality & Security Testing Framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "QA Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.2.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "ruff>=0.6.0",
    "locust>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "auth: Authentication tests",
    "authz: Authorization and role-based access control tests",
    "tenancy: Multi-tenant isolation tests",
    "api: Functional API tests",
    "database: Database persistence and integrity tests",
    "regression: Critical regression test suite",
    "performance: Performance and smoke tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/seed.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "__repr__",
]
